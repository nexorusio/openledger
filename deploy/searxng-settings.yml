# Private, API-only SearXNG configuration for OpenLedger.
# The container is reachable only on the Compose network and has no host port.
use_default_settings:
  engines:
    keep_only:
      - brave
      - duckduckgo

general:
  debug: false
  instance_name: OpenLedger Private Search
  enable_metrics: false

search:
  safe_search: 2
  autocomplete: ""
  formats:
    - json

server:
  # Compose replaces this value through the protected SEARXNG_SECRET setting.
  secret_key: overridden-by-SEARXNG_SECRET
  limiter: false
  public_instance: false
  image_proxy: false

outgoing:
  request_timeout: 5.0
  max_request_timeout: 8.0
  retries: 0
  enable_http2: true
