name: openledger

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openledger
      POSTGRES_USER: openledger
      POSTGRES_PASSWORD_FILE: /run/openledger-secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../runtime/secrets/postgres_password:/run/openledger-secrets/postgres_password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openledger -d openledger"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - openledger

  searxng:
    profiles: ["self-hosted-search"]
    # Pin the upstream revision; upgrades require a reviewed code change.
    image: docker.io/searxng/searxng:2026.9.8-3fdc6d753
    restart: unless-stopped
    user: "977:977"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET is required}
      GRANIAN_WORKERS: "1"
      GRANIAN_BLOCKING_THREADS: "2"
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
      - searxng_data:/var/cache/searxng
    healthcheck:
      test:
        - CMD
        - /usr/local/searxng/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 384m
    cpus: "0.50"
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - openledger

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    image: openledger-maigret:application-auth
    restart: "no"
    entrypoint: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: openledger
      DATABASE_USER: openledger
      DATABASE_PASSWORD_FILE: /app/runtime/secrets/postgres_password
    volumes:
      - ../runtime/secrets/postgres_password:/app/runtime/secrets/postgres_password:ro
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - openledger

  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    # A distinct tag prevents a failed authentication migration from falling
    # back to the older image that had no application-level login.
    image: openledger-maigret:application-auth
    restart: unless-stopped
    init: true
    environment:
      FLASK_HOST: 0.0.0.0
      PORT: 5000
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?FLASK_SECRET_KEY is required}
      SESSION_COOKIE_SECURE: "true"
      OPENLEDGER_PROXY_HOPS: "1"
      OPENLEDGER_TRUSTED_HOSTS: "${DOMAIN},127.0.0.1,localhost,app"
      WEB_SETTINGS_FILE: /app/web_settings.json
      AUTH_REQUIRED: "true"
      AUTH_FILE: /app/runtime/secrets/auth.json
      OPENLEDGER_PROFILE_DISCOVERY_ENABLED: "${OPENLEDGER_PROFILE_DISCOVERY_ENABLED:-true}"
      OPENLEDGER_FOCUSED_DISCOVERY_ENABLED: "${OPENLEDGER_FOCUSED_DISCOVERY_ENABLED:-true}"
      OPENLEDGER_EXHAUSTIVE_DISCOVERY_ENABLED: "${OPENLEDGER_EXHAUSTIVE_DISCOVERY_ENABLED:-true}"
      OPENLEDGER_MAIGRET_DISCOVERY_ENABLED: "${OPENLEDGER_MAIGRET_DISCOVERY_ENABLED:-true}"
      OPENLEDGER_USER_SCANNER_DISCOVERY_ENABLED: "${OPENLEDGER_USER_SCANNER_DISCOVERY_ENABLED:-true}"
      OPENLEDGER_ENRICHMENT_PROVIDERS_ENABLED: "${OPENLEDGER_ENRICHMENT_PROVIDERS_ENABLED:-true}"
      OPENLEDGER_PROVIDER_CIRCUIT_BREAKERS_ENABLED: "${OPENLEDGER_PROVIDER_CIRCUIT_BREAKERS_ENABLED:-true}"
      OPENLEDGER_GOVERNED_PIVOTS_ENABLED: "${OPENLEDGER_GOVERNED_PIVOTS_ENABLED:-true}"
      OPENLEDGER_SEARCH_FIRST_DISCOVERY_ENABLED: "${OPENLEDGER_SEARCH_FIRST_DISCOVERY_ENABLED:-false}"
      OPENLEDGER_PROFILE_SEARCH_PROVIDER: "${OPENLEDGER_PROFILE_SEARCH_PROVIDER:-disabled}"
      OPENLEDGER_PROFILE_SEARCH_API_KEY_FILE: /app/runtime/secrets/brave_search_api_key
      OPENLEDGER_PROFILE_SEARCH_TIMEOUT_SECONDS: "${OPENLEDGER_PROFILE_SEARCH_TIMEOUT_SECONDS:-10}"
      OPENLEDGER_PROFILE_SEARCH_MAX_RESULTS: "${OPENLEDGER_PROFILE_SEARCH_MAX_RESULTS:-5}"
      OPENAI_API_KEY_FILE: /app/runtime/secrets/openai_api_key
      GOOGLE_MAPS_API_KEY_FILE: /app/runtime/secrets/google_maps_api_key
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      OPENLEDGER_ALLOW_CUSTOM_AI_ENDPOINT: ${OPENLEDGER_ALLOW_CUSTOM_AI_ENDPOINT:-false}
      OPENLEDGER_ALLOW_PRIVATE_AI_ENDPOINT: ${OPENLEDGER_ALLOW_PRIVATE_AI_ENDPOINT:-false}
      OPENLEDGER_MAP_TILE_URL: ${OPENLEDGER_MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      OPENLEDGER_GEOCODER_URL: ${OPENLEDGER_GEOCODER_URL:-https://nominatim.openstreetmap.org/search}
      OPENLEDGER_GEOCODER_TIMEOUT_SECONDS: ${OPENLEDGER_GEOCODER_TIMEOUT_SECONDS:-10}
      DATABASE_HOST: db
      DATABASE_NAME: openledger
      DATABASE_USER: openledger
      DATABASE_PASSWORD_FILE: /app/runtime/secrets/postgres_password
    volumes:
      - ../runtime/reports:/tmp/maigret_reports
      - ../runtime/web_settings.json:/app/web_settings.json
      - ../runtime/secrets:/app/runtime/secrets
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - openledger

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    image: openledger-maigret:application-auth
    restart: unless-stopped
    init: true
    entrypoint: ["python", "-m", "maigret.web.worker"]
    environment:
      WEB_SETTINGS_FILE: /app/web_settings.json
      OPENLEDGER_PROFILE_DISCOVERY_ENABLED: "${OPENLEDGER_PROFILE_DISCOVERY_ENABLED:-true}"
      OPENLEDGER_FOCUSED_DISCOVERY_ENABLED: "${OPENLEDGER_FOCUSED_DISCOVERY_ENABLED:-true}"
      OPENLEDGER_EXHAUSTIVE_DISCOVERY_ENABLED: "${OPENLEDGER_EXHAUSTIVE_DISCOVERY_ENABLED:-true}"
      OPENLEDGER_MAIGRET_DISCOVERY_ENABLED: "${OPENLEDGER_MAIGRET_DISCOVERY_ENABLED:-true}"
      OPENLEDGER_USER_SCANNER_DISCOVERY_ENABLED: "${OPENLEDGER_USER_SCANNER_DISCOVERY_ENABLED:-true}"
      OPENLEDGER_ENRICHMENT_PROVIDERS_ENABLED: "${OPENLEDGER_ENRICHMENT_PROVIDERS_ENABLED:-true}"
      OPENLEDGER_PROVIDER_CIRCUIT_BREAKERS_ENABLED: "${OPENLEDGER_PROVIDER_CIRCUIT_BREAKERS_ENABLED:-true}"
      OPENLEDGER_GOVERNED_PIVOTS_ENABLED: "${OPENLEDGER_GOVERNED_PIVOTS_ENABLED:-true}"
      OPENLEDGER_SEARCH_FIRST_DISCOVERY_ENABLED: "${OPENLEDGER_SEARCH_FIRST_DISCOVERY_ENABLED:-false}"
      OPENLEDGER_PROFILE_SEARCH_PROVIDER: "${OPENLEDGER_PROFILE_SEARCH_PROVIDER:-disabled}"
      OPENLEDGER_PROFILE_SEARCH_API_KEY_FILE: /app/runtime/secrets/brave_search_api_key
      OPENLEDGER_PROFILE_SEARCH_TIMEOUT_SECONDS: "${OPENLEDGER_PROFILE_SEARCH_TIMEOUT_SECONDS:-10}"
      OPENLEDGER_PROFILE_SEARCH_MAX_RESULTS: "${OPENLEDGER_PROFILE_SEARCH_MAX_RESULTS:-5}"
      OPENAI_API_KEY_FILE: /app/runtime/secrets/openai_api_key
      GOOGLE_MAPS_API_KEY_FILE: /app/runtime/secrets/google_maps_api_key
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      OPENLEDGER_ALLOW_CUSTOM_AI_ENDPOINT: ${OPENLEDGER_ALLOW_CUSTOM_AI_ENDPOINT:-false}
      OPENLEDGER_ALLOW_PRIVATE_AI_ENDPOINT: ${OPENLEDGER_ALLOW_PRIVATE_AI_ENDPOINT:-false}
      DATABASE_HOST: db
      DATABASE_NAME: openledger
      DATABASE_USER: openledger
      DATABASE_PASSWORD_FILE: /app/runtime/secrets/postgres_password
      WORKER_POLL_SECONDS: "2"
    volumes:
      - ../runtime/reports:/tmp/maigret_reports
      - ../runtime/web_settings.json:/app/web_settings.json:ro
      - ../runtime/secrets:/app/runtime/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 90s
    security_opt:
      - no-new-privileges:true
    networks:
      - openledger

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    networks:
      - openledger

networks:
  openledger:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  searxng_data:
