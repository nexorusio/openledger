name: Upstream integrity

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: upstream-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'automation/maigret-upstream-sync'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out trusted guard from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: guard
          fetch-depth: 1

      - name: Check out synchronization candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0

      - name: Fetch PR base
        working-directory: candidate
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"

      - name: Classify paths and validate database integrity
        run: |
          python guard/.github/scripts/check_upstream_sync.py \
            --candidate candidate \
            --base guard \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --head-ref "${{ github.event.pull_request.head.sha }}"

  regression:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'automation/maigret-upstream-sync'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out synchronization candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          poetry install --with dev

      - name: Run offline regression suite
        run: poetry run pytest -m "not slow" tests

      - name: Validate production configuration
        run: |
          bash -n deploy/install.sh deploy/update.sh deploy/configure-auth.sh deploy/reset-password.sh
          DOMAIN=example.invalid FLASK_SECRET_KEY=test-secret docker compose -f deploy/compose.yaml config --quiet

      - name: Build production application image
        run: docker build --target web --tag openledger:upstream-check .

  merge:
    needs: [classify, regression]
    if: needs.classify.result == 'success' && needs.regression.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge verified database-only synchronization
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # A merge commit preserves upstream ancestry. Squash/rebase would make
          # every later synchronization replay already-integrated commits.
          gh pr merge "$PR_URL" --merge --delete-branch
