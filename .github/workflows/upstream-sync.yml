name: Check Maigret upstream

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: maigret-upstream-sync
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: soxoj/maigret
  SYNC_BRANCH: automation/maigret-upstream-sync

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      needed: ${{ steps.pending.outputs.needed }}
      clean: ${{ steps.merge.outputs.clean }}
      head_sha: ${{ steps.merge.outputs.head_sha }}
      pr_url: ${{ steps.pr.outputs.pr_url }}
    steps:
      - name: Check out OpenLedger
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream \
            "+refs/heads/main:refs/remotes/upstream/main"
          git rev-parse --verify "refs/remotes/upstream/main^{commit}"
          git fetch --no-tags origin \
            "+refs/heads/${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}" || true

      - name: Determine whether synchronization is needed
        id: pending
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "OpenLedger already contains the current Maigret upstream commit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            upstream_sha="$(git rev-parse --verify refs/remotes/upstream/main)"
            echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream on the synchronization branch
        if: steps.pending.outputs.needed == 'true'
        id: merge
        run: |
          git config user.name "openledger-upstream-bot"
          git config user.email "openledger-upstream-bot@users.noreply.github.com"
          git switch --force-create "$SYNC_BRANCH" HEAD
          if git merge --no-edit --no-ff upstream/main; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            git push --force-with-lease origin "$SYNC_BRANCH"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt
            git merge --abort
          fi

      - name: Report merge conflicts
        if: steps.pending.outputs.needed == 'true' && steps.merge.outputs.clean != 'true'
        env:
          UPSTREAM_SHA: ${{ steps.pending.outputs.upstream_sha }}
        run: |
          conflicts="$(sed 's/^/- `/' /tmp/conflicts.txt | sed 's/$/`/')"
          {
            echo "## Manual upstream resolution required"
            echo
            echo "Maigret \`$UPSTREAM_SHA\` could not be merged into OpenLedger \`main\`."
            echo
            echo "Conflicting files:"
            if [ -n "$conflicts" ]; then
              printf '%s\n' "$conflicts"
            else
              echo "- Conflict list was empty; inspect the merge step log."
            fi
            echo
            echo "Resolve this on a dedicated branch; do not overwrite OpenLedger \`main\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Manual upstream resolution required::Review the workflow summary for the conflicting files."
          exit 1

      - name: Create or update synchronization pull request
        if: steps.pending.outputs.needed == 'true' && steps.merge.outputs.clean == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.pending.outputs.upstream_sha }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$SYNC_BRANCH" --json number --jq '.[0].number // empty')
          body=$(printf 'Synchronizes OpenLedger with `soxoj/maigret@%s`.\n\nThe integrity workflow automatically merges only database-only updates that pass schema, checksum, compatibility, regression, and container checks. Any source, dependency, workflow, deployment, security, AI, or interface change remains open for manual review.\n\nThis PR must use a **merge commit**, not squash or rebase, so Git retains the upstream ancestry.' "$UPSTREAM_SHA")
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --title "Synchronize Maigret upstream" --body "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$SYNC_BRANCH" --title "Synchronize Maigret upstream" --body "$body"
          fi
          echo "pr_url=$(gh pr view "$SYNC_BRANCH" --repo "$GITHUB_REPOSITORY" --json url --jq .url)" >> "$GITHUB_OUTPUT"

  classify:
    needs: synchronize
    if: needs.synchronize.outputs.needed == 'true' && needs.synchronize.outputs.clean == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out trusted guard from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: guard
          fetch-depth: 1

      - name: Check out synchronization candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.synchronize.outputs.head_sha }}
          path: candidate
          fetch-depth: 0

      - name: Classify paths and validate database integrity
        run: |
          python guard/.github/scripts/check_upstream_sync.py \
            --candidate candidate \
            --base guard \
            --base-ref "${{ github.sha }}" \
            --head-ref "${{ needs.synchronize.outputs.head_sha }}"

  regression:
    needs: synchronize
    if: needs.synchronize.outputs.needed == 'true' && needs.synchronize.outputs.clean == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out synchronization candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.synchronize.outputs.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          poetry install --with dev

      - name: Run offline regression suite
        run: poetry run pytest -m "not slow" tests

      - name: Validate production configuration
        run: |
          bash -n deploy/install.sh deploy/update.sh deploy/configure-auth.sh deploy/reset-password.sh
          DOMAIN=example.invalid FLASK_SECRET_KEY=test-secret docker compose -f deploy/compose.yaml config --quiet

      - name: Build production application image
        run: docker build --target web --tag openledger:upstream-check .

  merge:
    needs: [synchronize, classify, regression]
    if: needs.classify.result == 'success' && needs.regression.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge verified database-only synchronization
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ needs.synchronize.outputs.pr_url }}
        run: |
          # Preserve upstream ancestry so future runs do not replay old commits.
          gh pr merge "$PR_URL" --merge --delete-branch
