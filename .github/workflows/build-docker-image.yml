name: Prepare P2 Docker candidate

# A merge must not publish a floating image or select a production release.
# Delivery uses the reviewed commit, immutable image and release manifest.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate and build reviewed P2 candidate
        run: |
          bash deploy/build-reviewed-release.sh --commit '${{ github.sha }}' \
            --manifest "$RUNNER_TEMP/p2-candidate.json"
      - name: Preserve candidate identity
        uses: actions/upload-artifact@v4
        with:
          name: p2-docker-candidate-identity
          path: ${{ runner.temp }}/p2-candidate.json
          if-no-files-found: error
      # Runner-local image is not published. This manifest is build evidence;
      # deployment requires a release-host image and separate authorization.
