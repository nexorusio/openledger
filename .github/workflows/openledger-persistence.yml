name: OpenLedger persistence safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  postgres-and-container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openledger_test
          POSTGRES_USER: openledger_test
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openledger_test -d openledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://openledger_test:integration-only-password@127.0.0.1:5432/openledger_test
      OPENLEDGER_TEST_POSTGRES_URL: postgresql+psycopg://openledger_test:integration-only-password@127.0.0.1:5432/openledger_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev postgresql
          python -m pip install --upgrade pip poetry
          poetry install --with dev

      - name: Apply and verify database migrations
        run: |
          poetry run alembic upgrade head
          poetry run alembic check

      - name: Test PostgreSQL job and worker integrity
        run: poetry run pytest -q tests/test_postgres_persistence.py tests/test_p3r_postgres.py

      - name: Install isolated browser test runtime
        run: |
          poetry run python -m pip install playwright
          poetry run python -m playwright install --with-deps chromium

      - name: Test persisted collection and review in Chromium
        env:
          OPENLEDGER_P3R_BROWSER: "1"
        run: poetry run pytest -q tests/p3r_browser_journey.py

      - name: Fetch pinned Leaflet fixture for isolated browser journeys
        run: |
          fixture_dir="$RUNNER_TEMP/openledger-leaflet-1.9.4"
          mkdir -p "$fixture_dir"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://unpkg.com/leaflet@1.9.4/dist/leaflet.js -o "$fixture_dir/leaflet.js"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://unpkg.com/leaflet@1.9.4/dist/leaflet.css -o "$fixture_dir/leaflet.css"
          test "$(openssl dgst -sha256 -binary "$fixture_dir/leaflet.js" | openssl base64 -A)" = \
            "20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          test "$(openssl dgst -sha256 -binary "$fixture_dir/leaflet.css" | openssl base64 -A)" = \
            "p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          echo "OPENLEDGER_TEST_LEAFLET_JS=$fixture_dir/leaflet.js" >> "$GITHUB_ENV"
          echo "OPENLEDGER_TEST_LEAFLET_CSS=$fixture_dir/leaflet.css" >> "$GITHUB_ENV"

      - name: Test full worker, PostgreSQL, report, SSE, map, and Chromium acceptance offline
        run: |
          test_python="$(poetry env info --path)/bin/python"
          bash .github/scripts/run_p3r_full_acceptance.sh "$test_python"

      - name: Validate deployment configuration
        env:
          DOMAIN: openledger.example.test
          FLASK_SECRET_KEY: integration-only-secret
          SEARXNG_SECRET: integration-only-searxng-secret
        run: docker compose -f deploy/compose.yaml config --quiet

      - name: Build the production web and worker image
        run: docker build --target web --tag openledger:persistence-test .

      - name: Verify the image runs unprivileged
        run: test "$(docker image inspect --format '{{.Config.User}}' openledger:persistence-test)" = "10001:10001"
